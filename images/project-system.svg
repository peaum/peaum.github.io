    </linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#g3)"/>
  <g fill="#ffffff" opacity="0.92">
    <rect x="80" y="80" width="170" height="100" rx="12"/>
    <rect x="380" y="80" width="170" height="100" rx="12"/>
